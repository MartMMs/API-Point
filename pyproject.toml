[project]
name = "pyapi"
version = "0.1.0"
description = "My api from RH"
authors = [
    {name = "Matheus Martins ",email = "matheus.19mmartins@gmail.com"}
]
package-mode = false
requires-python = ">=3.14"
dependencies = [
    "psycopg[binary] (>=3.3.4,<4.0.0)",
    "fastapi[standard] (>=0.139.2,<0.140.0)",
    "psycopg2 (>=2.9.12,<3.0.0)",
    "uvicorn (>=0.51.0,<0.52.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "databases (>=0.9.0,<0.10.0)",
    "sqlalchemy (>=2.0.51,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "pyjwt (>=2.13.0,<3.0.0)",
    "cryptography (>=49.0.0,<50.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
